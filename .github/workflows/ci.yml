name: Validate Pact lifecycle
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env: { POSTGRES_USER: pact, POSTGRES_PASSWORD: pact_ci_only, POSTGRES_DB: pact }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pact" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4.7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      MIGRATION_DATABASE_URL: postgresql://pact:pact_ci_only@localhost:5432/pact
      DATABASE_URL: postgresql://pact_runtime:pact_runtime_ci_only@localhost:5432/pact
      APP_DATABASE_PASSWORD: pact_runtime_ci_only
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm prepare:packages
      - run: pnpm encoding:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:bootstrap
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-test-results, path: test-results, retention-days: 7 }
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          {
            python-version: '3.11',
            cache: pip,
            cache-dependency-path: apps/ai/requirements.lock.txt,
          }
      - run: pip install -r apps/ai/requirements.lock.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r apps/ai/requirements.lock.txt
      - run: ruff check apps/ai
      - run: pytest apps/ai
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0 }
      - run: node scripts/setup-local-env.mjs
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - run: docker compose exec -T api node scripts/minio-bootstrap.mjs
      - run: docker compose exec -T -e MINIO_PUBLIC_ENDPOINT=http://minio:9000 api node scripts/validate-local-security.mjs
      - run: curl --fail http://localhost:3000 && curl --fail http://localhost:4000/ready && curl --fail http://localhost:8000/health
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
